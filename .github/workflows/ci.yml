name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly rebuild of the published catalog, which also re-checks that all
  # referenced gems still exist and that dependencies have no known vulnerabilities
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Jobs only get read access to the repository unless they need more
permissions:
  contents: read

# Superseded pull request runs get cancelled, runs on main always complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bundler settings previously provided by ruby/setup-ruby's bundler-cache
  BUNDLE_PATH: vendor/bundle
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "3"
  BUNDLE_FROZEN: "true"

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - run: mise run lint:bundler-audit

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - run: mise run lint:rubocop

  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - run: mise run test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Test Coverage"
          path: coverage/

  pages:
    # Pull requests are refs/pull/*, so only main ever gets published
    if: github.ref == 'refs/heads/main'
    needs: [bundler-audit, rubocop, rspec]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Jekyll looks up the site's base URL via the Pages API
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - run: mise run export
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./build
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Queue deployments instead of cancelling one that is in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
